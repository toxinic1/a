<!DOCTYPE html>
<html>
<head>
  <title>Super Clicker</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial;
      text-align: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
    }

    h1 {
      margin-top: 20px;
    }

    #score {
      font-size: 28px;
      margin: 20px;
    }

    #clickBtn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: none;
      font-size: 20px;
      cursor: pointer;
      background: gold;
      transition: transform 0.1s;
    }

    #clickBtn:active {
      transform: scale(0.9);
    }

    .shop {
      margin-top: 30px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  .popup {
    position: absolute;
    color: red;
    font-weight: bold;
    font-size: 20px;
    pointer-events: none;
    animation: floatUp 0.8s ease-out forwards;
  }

  @keyframes floatUp {
    0% {
      opacity: 1;
      transform: translateY(0);
    }
    100% {
      opacity: 0;
      transform: translateY(-50px);
    }
  }
  .shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.1);
    padding: 15px;
    margin: 15px;
    border-radius: 10px;
  }

  .upgrade-left {
    text-align: left;
  }

  .upgrade-desc {
    font-size: 14px;
    opacity: 0.8;
  }

  #upgradeBtn {
    min-width: 90px;
  }
    
    .particle {
  position: fixed;
  pointer-events: none;
  font-weight: bold;
  font-size: 18px;
  animation: floatUp 0.8s ease-out forwards;
}

@keyframes floatUp {
  0% {
    opacity: 1;
    transform: translateY(0px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-40px) scale(1.5);
  }
}
    button:disabled {
  background-color: gray;
  color: #ccc;
  cursor: not-allowed;
  opacity: 0.7;
}
  </style>
</head>
<body>

<h1>💰 Super Clicker</h1>
<div id="score">Coins: 0</div>
<h3 id="incomeText">Passive Income: 0/sec</h3>

<button id="clickBtn">Press me</button>

<div class="shop">

  <!-- Power Click -->
  <div class="shop-item">
    <div class="upgrade-left">
      <div id="powerLevel">0/∞ Power Click</div>
      <div class="upgrade-desc">+1 per upgrade</div>
    </div>
    <button id="powerBtn" onclick="buyPower(this)">Cost: 10</button>
  </div>

  <!-- Auto Clicker -->
  <div class="shop-item">
    <div class="upgrade-left">
      <div id="autoLevel">0/∞ Auto Clicker</div>
      <div class="upgrade-desc">+1 coin per second</div>
    </div>
    <button id="autoBtn" onclick="buyAuto(this)">Cost: 50</button>
  </div>

  <!-- Mega Click -->
  <div class="shop-item">
    <div class="upgrade-left">
      <div id="megaLevel">0/∞ Mega Click</div>
      <div class="upgrade-desc">+5 per upgrade</div>
    </div>
    <button id="megaBtn" onclick="buyMega(this)">Cost: 100</button>
  </div>

</div>


<script>
  let powerLevel = 0;
  let autoLevel = 0;
  let megaLevel = 0;

  let powerCost = 10;
  let autoCost = 50;
  let megaCost = 100;

  let autoIncome = 0;
  
  let upgradeLevel = 0;
  let coins = 0;
  let perClick = 1;
  let upgradeCost = 10;

  const powerLevelText = document.getElementById("powerLevel");
  const autoLevelText = document.getElementById("autoLevel");
  const megaLevelText = document.getElementById("megaLevel");

  const powerBtn = document.getElementById("powerBtn");
  const autoBtn = document.getElementById("autoBtn");
  const megaBtn = document.getElementById("megaBtn");
  
  const upgradeLevelText = document.getElementById("upgradeLevel");
  const upgradeBtn = document.getElementById("upgradeBtn");
  const scoreText = document.getElementById("score");
  const clickBtn = document.getElementById("clickBtn");

  function showParticles(x, y, text = "+1") {
  for (let i = 0; i < 6; i++) {
    const particle = document.createElement("div");
    particle.className = "particle";
    particle.textContent = text;

    particle.style.left = x + (Math.random() * 40 - 20) + "px";
    particle.style.top = y + (Math.random() * 20 - 10) + "px";

    document.body.appendChild(particle);

    setTimeout(() => {
      particle.remove();
    }, 800);
  }
}

  // 🔹 LOAD
  function loadGame() {
  coins = parseInt(localStorage.getItem("coins")) || 0;
  perClick = parseInt(localStorage.getItem("perClick")) || 1;
  autoIncome = parseInt(localStorage.getItem("autoIncome")) || 0;

  upgradeLevel = parseInt(localStorage.getItem("upgradeLevel")) || 0;
  powerLevel = parseInt(localStorage.getItem("powerLevel")) || 0;
  autoLevel = parseInt(localStorage.getItem("autoLevel")) || 0;
  megaLevel = parseInt(localStorage.getItem("megaLevel")) || 0;

  upgradeCost = parseInt(localStorage.getItem("upgradeCost")) || 10;
  powerCost = parseInt(localStorage.getItem("powerCost")) || 20;
  autoCost = parseInt(localStorage.getItem("autoCost")) || 50;
  megaCost = parseInt(localStorage.getItem("megaCost")) || 100;
}

  // 🔹 SAVE
  function saveGame() {
  localStorage.setItem("coins", coins);
  localStorage.setItem("perClick", perClick);
  localStorage.setItem("autoIncome", autoIncome);

  localStorage.setItem("upgradeLevel", upgradeLevel);
  localStorage.setItem("powerLevel", powerLevel);
  localStorage.setItem("autoLevel", autoLevel);
  localStorage.setItem("megaLevel", megaLevel);

  localStorage.setItem("upgradeCost", upgradeCost);
  localStorage.setItem("powerCost", powerCost);
  localStorage.setItem("autoCost", autoCost);
  localStorage.setItem("megaCost", megaCost);
}
  
  function updateUI() {
  scoreText.textContent = "Coins: " + coins;

  powerLevelText.textContent = powerLevel + "/∞ Power Click";
  autoLevelText.textContent = autoLevel + "/∞ Auto Clicker";
  megaLevelText.textContent = megaLevel + "/∞ Mega Click";

  powerBtn.textContent = "Cost: " + powerCost;
  autoBtn.textContent = "Cost: " + autoCost;
  megaBtn.textContent = "Cost: " + megaCost;

  document.getElementById("score").textContent =
    "Coins: " + coins;
  document.getElementById("incomeText").textContent =
    "Passive Income: " + autoIncome + "/sec";
    
    
  document.getElementById("powerBtn").textContent =
  "Cost: " + powerCost;
  document.getElementById("powerBtn").disabled =
  coins < powerCost;
    

  document.getElementById("autoBtn").textContent =
  "Cost: " + autoCost;
  document.getElementById("autoBtn").disabled =
  coins < autoCost;
    

  document.getElementById("megaBtn").textContent =
  "Cost: " + megaCost;
  document.getElementById("megaBtn").disabled =
  coins < megaCost;
    
  saveGame();
}
  function showPopup(amount, x, y) {
    const popup = document.createElement("div");
    popup.className = "popup";
    popup.textContent = "+" + amount;
    popup.style.left = x + "px";
    popup.style.top = y + "px";

    document.body.appendChild(popup);

    setTimeout(() => {
      popup.remove();
    }, 800);
  }
  clickBtn.addEventListener("click", (e) => {
  coins += perClick;
  updateUI();

  showPopup(perClick, e.clientX, e.clientY);
});

  // 🔹 BASIC UPGRADE (if still using it)
function buyUpgrade(button) {
  if (coins >= upgradeCost) {
    coins -= upgradeCost;
    perClick += 1;
    upgradeLevel++;
    upgradeCost += 10;
    updateUI();
    
    // 🔥 Get button center position
    const rect = button.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    showParticles(centerX, centerY, "✨");
  } else {
    alert("Not enough coins!");
  }
}


// 🔹 POWER UPGRADE
function buyPower(button) {
  if (coins >= powerCost) {
    coins -= powerCost;
    perClick += 1;
    powerLevel++;
    powerCost += 10;
    updateUI();
    
    // 🔥 Get button center position
    const rect = button.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    showParticles(centerX, centerY, "✨");
  } else {
    alert("Not enough coins!");
  }
}


// 🔹 AUTO UPGRADE
function buyAuto(button) {
  if (coins >= autoCost) {
    coins -= autoCost;
    autoIncome += 1;
    autoLevel++;
    autoCost += 25;
    updateUI();

   // 🔥 Get button center position
    const rect = button.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    showParticles(centerX, centerY, "✨");
  } else {
    alert("Not enough coins!");
  }
}


// 🔹 MEGA UPGRADE
function buyMega(button) {
  if (coins >= megaCost) {
    coins -= megaCost;
    perClick += 5;
    megaLevel++;
    megaCost += 50;
    updateUI();

    // 🔥 Get button center position
    const rect = button.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    showParticles(centerX, centerY, "✨");
  } else {
    alert("Not enough coins!");
  }
}


// 🔹 AUTO INCOME
setInterval(() => {
  if (autoIncome > 0) {
    coins += autoIncome;
    updateUI();
  }
}, 1000);

setInterval(saveGame, 1000);


// 🔹 START GAME
loadGame();
updateUI();
  
</script>
  
</body>
</html>
