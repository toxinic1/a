<!DOCTYPE html>
<html>
<head>
  <title>Super Clicker</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial;
      text-align: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
    }

    h1 {
      margin-top: 20px;
    }

    #score {
      font-size: 28px;
      margin: 20px;
    }

    #clickBtn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: none;
      font-size: 20px;
      cursor: pointer;
      background: gold;
      transition: transform 0.1s;
    }

    #clickBtn:active {
      transform: scale(0.9);
    }

    .shop {
      margin-top: 30px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  .popup {
    position: absolute;
    color: red;
    font-weight: bold;
    font-size: 20px;
    pointer-events: none;
    animation: floatUp 0.8s ease-out forwards;
  }

  @keyframes floatUp {
    0% {
      opacity: 1;
      transform: translateY(0);
    }
    100% {
      opacity: 0;
      transform: translateY(-50px);
    }
  }
  .shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.1);
    padding: 15px;
    margin: 15px;
    border-radius: 10px;
  }

  .upgrade-left {
    text-align: left;
  }

  .upgrade-desc {
    font-size: 14px;
    opacity: 0.8;
  }

  #upgradeBtn {
    min-width: 90px;
  }
  </style>
</head>
<body>

<h1>💰 Super Clicker</h1>
<div id="score">Coins: 0</div>

<button id="clickBtn">Press me</button>

<div class="shop">

  <!-- Power Click -->
  <div class="shop-item">
    <div class="upgrade-left">
      <div id="powerLevel">0/∞ Power Click</div>
      <div class="upgrade-desc">+1 per upgrade</div>
    </div>
    <button id="powerBtn" onclick="buyPower()">Cost: 10</button>
  </div>

  <!-- Auto Clicker -->
  <div class="shop-item">
    <div class="upgrade-left">
      <div id="autoLevel">0/∞ Auto Clicker</div>
      <div class="upgrade-desc">+1 coin per second</div>
    </div>
    <button id="autoBtn" onclick="buyAuto()">Cost: 50</button>
  </div>

  <!-- Mega Click -->
  <div class="shop-item">
    <div class="upgrade-left">
      <div id="megaLevel">0/∞ Mega Click</div>
      <div class="upgrade-desc">+5 per upgrade</div>
    </div>
    <button id="megaBtn" onclick="buyMega()">Cost: 100</button>
  </div>

</div>


<script>
  let powerLevel = 0;
  let autoLevel = 0;
  let megaLevel = 0;

  let powerCost = 10;
  let autoCost = 50;
  let megaCost = 100;

  let autoIncome = 0;
  
  let upgradeLevel = 0;
  let coins = 0;
  let perClick = 1;
  let upgradeCost = 10;

  const powerLevelText = document.getElementById("powerLevel");
  const autoLevelText = document.getElementById("autoLevel");
  const megaLevelText = document.getElementById("megaLevel");

  const powerBtn = document.getElementById("powerBtn");
  const autoBtn = document.getElementById("autoBtn");
  const megaBtn = document.getElementById("megaBtn");
  
  const upgradeLevelText = document.getElementById("upgradeLevel");
  const upgradeBtn = document.getElementById("upgradeBtn");
  const scoreText = document.getElementById("score");
  const clickBtn = document.getElementById("clickBtn");

  // 🔹 LOAD
  function loadGame() {
  const savedData = localStorage.getItem("superClickerSave");

  if (savedData) {
    const data = JSON.parse(savedData);
    coins = data.coins;
    perClick = data.perClick;
    upgradeCost = data.upgradeCost;
    upgradeLevel = data.upgradeLevel || 0;
  }
}

  // 🔹 SAVE
  function saveGame() {
  const data = {
    coins: coins,
    perClick: perClick,
    upgradeCost: upgradeCost,
    upgradeLevel: upgradeLevel
  };

  localStorage.setItem("superClickerSave", JSON.stringify(data));
}
  
  function updateUI() {
  scoreText.textContent = "Coins: " + coins;

  powerLevelText.textContent = powerLevel + "/∞ Power Click";
  autoLevelText.textContent = autoLevel + "/∞ Auto Clicker";
  megaLevelText.textContent = megaLevel + "/∞ Mega Click";

  powerBtn.textContent = "Cost: " + powerCost;
  autoBtn.textContent = "Cost: " + autoCost;
  megaBtn.textContent = "Cost: " + megaCost;

  saveGame();
}
  function showPopup(amount, x, y) {
    const popup = document.createElement("div");
    popup.className = "popup";
    popup.textContent = "+" + amount;
    popup.style.left = x + "px";
    popup.style.top = y + "px";

    document.body.appendChild(popup);

    setTimeout(() => {
      popup.remove();
    }, 800);
  }
  clickBtn.addEventListener("click", (e) => {
  coins += perClick;
  updateUI();

  showPopup(perClick, e.clientX, e.clientY);
});

  // 🔹 BASIC UPGRADE (if still using it)
function buyUpgrade() {
  if (coins >= upgradeCost) {
    coins -= upgradeCost;
    perClick += 1;
    upgradeLevel++;
    upgradeCost += 10;
    updateUI();
  } else {
    alert("Not enough coins!");
  }
}


// 🔹 POWER UPGRADE
function buyPower() {
  if (coins >= powerCost) {
    coins -= powerCost;
    perClick += 1;
    powerLevel++;
    powerCost += 10;
    updateUI();
  } else {
    alert("Not enough coins!");
  }
}


// 🔹 AUTO UPGRADE
function buyAuto() {
  if (coins >= autoCost) {
    coins -= autoCost;
    autoIncome += 1;
    autoLevel++;
    autoCost += 25;
    updateUI();
  } else {
    alert("Not enough coins!");
  }
}


// 🔹 MEGA UPGRADE
function buyMega() {
  if (coins >= megaCost) {
    coins -= megaCost;
    perClick += 5;
    megaLevel++;
    megaCost += 50;
    updateUI();
  } else {
    alert("Not enough coins!");
  }
}


// 🔹 AUTO INCOME
setInterval(() => {
  if (autoIncome > 0) {
    coins += autoIncome;
    updateUI();
  }
}, 1000);


// 🔹 START GAME
loadGame();
updateUI();
  
</script>
  
</body>
</html>
