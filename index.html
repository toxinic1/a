<!DOCTYPE html>
<html>
<head>
  <title>Super Clicker</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial;
      text-align: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
    }

    h1 {
      margin-top: 20px;
    }

    #score {
      font-size: 28px;
      margin: 20px;
    }

    #clickBtn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: none;
      font-size: 20px;
      cursor: pointer;
      background: gold;
      transition: transform 0.1s;
    }

    #clickBtn:active {
      transform: scale(0.9);
    }

    .shop {
      margin-top: 30px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  .popup {
    position: absolute;
    color: yellow;
    font-weight: bold;
    font-size: 20px;
    pointer-events: none;
    animation: floatUp 0.8s ease-out forwards;
  }

  @keyframes floatUp {
    0% {
      opacity: 1;
      transform: translateY(0);
    }
    100% {
      opacity: 0;
      transform: translateY(-50px);
    }
  }
  .shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.1);
    padding: 15px;
    margin: 15px;
    border-radius: 10px;
  }

  .upgrade-left {
    text-align: left;
  }

  .upgrade-desc {
    font-size: 14px;
    opacity: 0.8;
  }

  #upgradeBtn {
    min-width: 90px;
  }
  </style>
</head>
<body>

<h1>💰 Super Clicker</h1>
<div id="score">Coins: 0</div>

<button id="clickBtn">CLICK</button>

<div class="shop-item">
  <div class="upgrade-left">
    <div id="upgradeLevel">0/∞ Power Click</div>
    <div class="upgrade-desc">+1 per upgrade</div>
  </div>
  <button id="upgradeBtn" onclick="buyUpgrade()">
    Cost: 10
  </button>
</div>


<script>
  let upgradeLevel = 0;
  let coins = 0;
  let perClick = 1;
  let upgradeCost = 10;

  const upgradeLevelText = document.getElementById("upgradeLevel");
  const upgradeBtn = document.getElementById("upgradeBtn");
  const scoreText = document.getElementById("score");
  const clickBtn = document.getElementById("clickBtn");
  const upgradeBtn = document.getElementById("upgradeBtn");

  // 🔹 LOAD
  function loadGame() {
    const savedData = localStorage.getItem("superClickerSave");

    if (savedData) {
      const data = JSON.parse(savedData);
      coins = data.coins;
      perClick = data.perClick;
      upgradeCost = data.upgradeCost;
    }
  }

  // 🔹 SAVE
  function saveGame() {
    const data = {
      coins: coins,
      perClick: perClick,
      upgradeCost: upgradeCost
    };

    localStorage.setItem("superClickerSave", JSON.stringify(data));
  }

  function updateUI() {
  scoreText.textContent = "Coins: " + coins;

  upgradeLevelText.textContent =
    upgradeLevel + "/∞ Power Click";

  upgradeBtn.textContent =
    "Cost: " + upgradeCost;

  saveGame();
  }
  function showPopup(amount, x, y) {
    const popup = document.createElement("div");
    popup.className = "popup";
    popup.textContent = "+" + amount;
    popup.style.left = x + "px";
    popup.style.top = y + "px";

    document.body.appendChild(popup);

    setTimeout(() => {
      popup.remove();
    }, 800);
  }
  clickBtn.addEventListener("click", (e) => {
  coins += perClick;
  updateUI();

  showPopup(perClick, e.clientX, e.clientY);
});

 function buyUpgrade() {
  if (coins >= upgradeCost) {
    coins -= upgradeCost;
    perClick += 1;
    upgradeLevel += 1;
    upgradeCost += 10;
    updateUI();
  } else {
    alert("Not enough coins!");
  }
}

  loadGame();
  updateUI();
</script>
  
</body>
</html>
